name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: bosque
          POSTGRES_PASSWORD: ci-local-only
          POSTGRES_DB: bosque_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bosque -d bosque_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      AI_PROVIDER: mock
      TEST_DATABASE_URL: postgresql://bosque:ci-local-only@localhost:5432/bosque_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.3
      - run: uv sync --project services/api --extra dev --extra raster --frozen
      - run: uv run --project services/api --extra dev --extra raster --frozen ruff check services evaluations
      - run: uv run --project services/api --extra dev --extra raster --frozen ruff format --check services evaluations
      - run: uv run --project services/api --extra dev --extra raster --frozen python -c "import bosque_api.main, bosque_ai.meta, bosque_geo.contracts"
      - run: uv run --project services/api --extra dev --extra raster --frozen pytest -c services/api/pyproject.toml services -q
      - name: HTTP health smoke
        run: |
          uv run --project services/api --extra dev --extra raster --frozen uvicorn bosque_api.main:app --port 8000 &
          api_pid=$!
          trap 'kill "$api_pid"' EXIT
          curl --fail --retry 10 --retry-delay 1 --retry-connrefused http://localhost:8000/health

  repository:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python scripts/check_repository.py
      - run: python -m unittest discover -s scripts/tests
      - name: Compose config
        env:
          POSTGRES_PASSWORD: ci-local-only
        run: docker compose config --quiet
      - name: Build API and web containers
        env:
          POSTGRES_PASSWORD: ci-local-only
        run: docker compose build
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
