[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "bosque-geospatial"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = ["pydantic==2.14.1", "shapely==2.2.0"]

[project.optional-dependencies]
raster = ["rasterio==1.5.2", "pyproj==3.8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/bosque_geo"]
