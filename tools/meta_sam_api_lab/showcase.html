<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bosque Vivo · SAM 3.1 Visual Lab</title>
<style>
  :root { --bg:#0b0f0d; --panel:#121815; --line:#22302a; --ink:#ecefe9; --mute:#9aa59f; --accent:#a855f7; --ok:#34d399; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.4 system-ui, "Segoe UI", sans-serif; }
  header { display:flex; align-items:baseline; gap:16px; padding:14px 22px; border-bottom:1px solid var(--line); }
  header h1 { font-size:18px; margin:0; letter-spacing:.3px; }
  header span { color:var(--accent); font-weight:600; font-size:12px; text-transform:uppercase; }
  main { display:grid; grid-template-columns:280px 1fr 320px; height:calc(100vh - 52px); }
  aside { overflow:auto; border-right:1px solid var(--line); padding:12px; background:var(--panel); }
  aside.right { border-right:0; border-left:1px solid var(--line); }
  .chips button, .modes button { background:#1a221e; color:var(--ink); border:1px solid var(--line); border-radius:999px; padding:5px 11px; margin:3px; cursor:pointer; }
  .chips button.on, .modes button.on { border-color:var(--accent); color:#fff; background:#2a1840; }
  .run { padding:7px 9px; border-radius:8px; cursor:pointer; margin:2px 0; border:1px solid transparent; }
  .run:hover { background:#1a221e; } .run.on { border-color:var(--accent); }
  .run small { color:var(--mute); display:block; }
  section.stage { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:12px; gap:10px; }
  .canvases { display:flex; gap:10px; width:100%; justify-content:center; }
  canvas { max-width:100%; max-height:70vh; border-radius:10px; background:#000; }
  .timeline { width:100%; display:flex; align-items:center; gap:8px; }
  .timeline input[type=range] { flex:1; accent-color:var(--accent); }
  #conf { width:100%; height:46px; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  td { border-bottom:1px solid var(--line); padding:4px 2px; vertical-align:top; }
  td:first-child { color:var(--mute); width:42%; }
  .obj { display:flex; align-items:center; gap:6px; margin:3px 0; }
  .sw { width:12px; height:12px; border-radius:3px; display:inline-block; }
  .tag { font-size:11px; border-radius:6px; padding:2px 6px; }
  .tag.sam { background:#13352a; color:var(--ok); } .tag.muse { background:#2a1840; color:#d8b4fe; }
  .muted { color:var(--mute); } .warn { color:#fbbf24; }
</style>
</head>
<body>
<header><h1>Bosque Vivo · SAM 3.1 Visual Lab</h1><span>Resultados reales · solo lectura · sin nuevas llamadas</span></header>
<main>
  <aside>
    <div class="chips" id="domains"></div>
    <div id="runs"></div>
  </aside>
  <section class="stage">
    <div class="modes" id="modes"></div>
    <div class="canvases"><canvas id="a"></canvas><canvas id="b" hidden></canvas></div>
    <div class="timeline" id="timeline" hidden>
      <button id="play">▶</button><button id="step">⏭</button>
      <select id="speed"><option>0.25</option><option>0.5</option><option selected>1</option><option>2</option></select>
      <input type="range" id="seek" min="0" value="0"><span id="clock" class="muted"></span>
    </div>
    <canvas id="conf" hidden></canvas>
    <label class="muted">Opacidad <input type="range" id="alpha" min="0" max="90" value="45"></label>
  </section>
  <aside class="right">
    <div id="meta"></div>
    <h4>Instancias (SAM)</h4><div id="objects"></div>
    <h4>Identificación (Muse, separada)</h4><div id="muse" class="muted">Sin análisis Muse para este resultado.</div>
  </aside>
</main>
<script src="/showcase-core.js"></script>
<script src="/showcase.js"></script>
</body>
</html>
