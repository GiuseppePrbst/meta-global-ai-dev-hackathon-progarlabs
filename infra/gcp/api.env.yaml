# Non-secret Cloud Run settings. Secrets come from Secret Manager (see infra/gcp/README.md).
SERVICE_MODE: demo
AI_PROVIDER: meta
# Meta runs only for cohorts with ai_enabled (migration 008); public_trial stays off.
# BUDGET_UNITS is the daily cap (USD 10), BUDGET_LIFETIME_UNITS the USD 90 reservation cap.
META_ENABLED: "true"
BUDGET_UNITS: "10000000"
BUDGET_LIFETIME_UNITS: "90000000"
META_TIMEOUT_SECONDS: "90"
BUDGET_CONCURRENCY: "1"
BUDGET_IDENTITY_UNITS: "0"
# Web dev origins only: José's web (3000), Wilo Lab (3001) and Expo Web (8081). Native apps send
# no Origin; their authorization is the session token. Production origin: added when known.
CORS_ORIGINS: '["http://localhost:3000","http://localhost:3001","http://127.0.0.1:3001","http://localhost:8081"]'
# Closed beta (migration 005): only this operator credential may create invitations.
ADMIN_IDENTITIES: '["cloud-demo"]'
SESSION_TTL_MINUTES: "60"
# Stage 5 (04-11-2026, owner authorization of USD 100): each cohort decides whether AI runs.
BUDGET_COHORTS_ENABLED: "true"
FIREBASE_PROJECT_ID: nice-carving-513619-t4
GUIDE_RESERVATION_UNITS: "100000"
VOICE_RESERVATION_UNITS: "5000"
META_RESERVATION_UNITS: "30000"
BUDGET_REQUESTS: "300"
BUDGET_REQUESTS_PER_IDENTITY: "100"
