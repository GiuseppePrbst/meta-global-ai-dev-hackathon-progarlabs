name = "bosque-vivo-api-proxy"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = false
# Custom domain: Cloudflare creates only this hostname's DNS record and certificate.
routes = [{ pattern = "api-bosquevivo.progarlabs.com", custom_domain = true }]

[vars]
# Cloud Run service URL (not secret). Set after the first deploy.
ORIGIN_URL = "https://REPLACE_WITH_CLOUD_RUN_URL"

# Secret (never in this file): npx wrangler secret put ORIGIN_AUTH_TOKEN
